plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '5.2.0'
    id 'org.jetbrains.kotlin.jvm' version '1.5.30'
}

group = 'me.xpyex'
version = '3.5.1'

repositories {
    maven { url "https://s01.oss.sonatype.org/content/repositories/snapshots" }
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    //compileOnly fileTree(dir:'libs' ,include:['*.jar'])
    compileOnly 'top.mrxiaom.mirai:overflow-core:1.0.0'
    compileOnly 'net.mamoe:mirai-core-all:2.16.0'
    compileOnly 'net.mamoe:mirai-console:2.16.0'
    compileOnly 'org.projectlombok:lombok:1.18.22'
    annotationProcessor 'org.projectlombok:lombok:1.18.22'
    //compileOnly 'com.github.MrGraversen:minecraft-rcon:1.0.0'

    compileOnly 'cn.hutool:hutool-all:5.8.21'
    compileOnly 'io.netty:netty-all:4.1.72.Final'
    compileOnly 'com.kennycason:kumo-core:1.28'
    compileOnly 'com.kennycason:kumo-tokenizers:1.28'
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

shadowJar {
    exclude("kotlin/**")
}
